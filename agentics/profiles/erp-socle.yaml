# agentics profile for ece-madagascar/erp-socle, used in its dev container only.
# agentics-profiles.sh copies it to the repo root once and hides it from git (.git/info/exclude).
# Paths are the container's: the repo is /workspaces/erp-socle, agentics and the secondbrain are in $HOME.
name: erp-socle
project:
  root: .
  source_globs:
    - "src/**/*.cs"
    # The front end is source too: without it the guard never reverts a front-end change, so no vitest test
    # can be shown to fail without it (agentics docs/multi-suite-design.md, slice 5).
    - "front/shell/src/**/*.ts"
    - "front/shell/src/**/*.tsx"
  exclude:
    - "**/bin/**"
    - "**/obj/**"
    - "**/Migrations/**"
tests:
  # The whole suite, as the repo's AGENTS.md asks before a change is done (architecture tests included).
  authoritative: "dotnet test"
  # Quick check without Socle.Identity.IntegrationTests, the only project that starts PostgreSQL through
  # Testcontainers. One command, because the kernel runs it as argv and refuses `&&`. Exit code 8 = "zero tests
  # ran", which the filter makes true for the integration project. The name and what is below it, not `Name*`, which
  # would also take a project named Socle.Identity.IntegrationTestsX. Measured 2026-11-15 in the container: 490 of
  # 756 tests, exit 0.
  fast: "dotnet test --solution Socle.slnx --filter-not-namespace \"Socle.Identity.IntegrationTests\" --filter-not-namespace \"Socle.Identity.IntegrationTests.*\" --ignore-exit-code 8"
  # mtp, not xunit: global.json runs the tests on Microsoft.Testing.Platform, whose summary the xunit parser cannot read.
  parser: mtp
  # The front end's vitest suite, run by the kernel beside `dotnet test`: a red one fails G-TEST-EXIT, and its tests
  # can prove acceptance criteria. From the repo root (the kernel runs no `cd`); node_modules is in front/shell.
  # Measured 2026-11-15 through the kernel's own executor: 280 tests, 19.8 s.
  extra:
    - name: front
      command: "npx --no --prefix front/shell vitest run --root front/shell"
      parser: jest
      root: front/shell
security:
  - auth
  - token
  - secret
  - password
  - permission
  - personal data
knowledge_base: /home/vscode/secondbrain
# Outside the repo: the reports are mine, not the team's.
reports: /home/vscode/agentics-reports/erp-socle
